name: CI — web-seller

on:
  push:
    branches: [main, web-seller]
    paths:
      - 'apps/web-seller/**'
      - 'packages/types/**'
      - '.github/workflows/ci-web-seller-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/web-seller/**'
      - 'packages/types/**'

jobs:
  ci:
    name: Typecheck · Build (web-seller)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          # Держим в согласии с package.json → packageManager (pnpm@11.12.0).
          # Под pnpm 9 overrides читались из package.json, а не из
          # pnpm-workspace.yaml — 35 security-оверрайдов не применялись (issue #10).
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # frozen: расхождение lockfile должно ронять CI, а не молча чиниться.
      # Раньше здесь стоял --frozen-lockfile=false, из-за чего рассинхрон
      # lockfile с конфигом в этой джобе не всплывал никогда (issue #11).
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter web-seller exec tsc --noEmit

      # Джоба называлась «Vitest smoke» и зеленела на каждом push, не выполняя
      # ничего: скрипта `test` в пакете нет, а pnpm при отсутствии скрипта в
      # отфильтрованном пакете выходит с кодом 0 молча. Теперь отсутствие
      # тестов — видимый warning в логе, а не невидимая зелёная галочка.
      # Гейт держат Typecheck и Build. Упростить до `pnpm --filter web-seller test`,
      # когда появятся настоящие тесты.
      - name: Tests
        run: |
          if node -e "process.exit(require('./apps/web-seller/package.json').scripts?.test ? 0 : 1)"; then
            pnpm --filter web-seller test
          else
            echo "::warning title=web-seller: тестов нет::В apps/web-seller/package.json нет скрипта 'test' и нет ни одного *.test.* / *.spec.* файла. Гейт держат только Typecheck и Build. См. issue #11."
          fi

      - name: Build
        run: pnpm --filter web-seller build

      # TODO(#14): сделать блокирующим, когда закрыты накопленные lint-ошибки.
      # Сейчас web-seller lint красный (6 errors / 9 warnings) — блокирующим
      # шагом он остановит main.
      - name: Lint (non-blocking, см. issue #14)
        continue-on-error: true
        run: pnpm --filter web-seller lint
