name: CI — web-seller tests

on:
  push:
    branches: [main, web-seller]
    paths:
      - 'apps/web-seller/**'
      - 'packages/types/**'
      - '.github/workflows/ci-web-seller-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/web-seller/**'
      - 'packages/types/**'

jobs:
  test:
    name: Vitest smoke (web-seller)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        # Версию НЕ указываем: action-setup@v4 берёт её из package.json →
        # packageManager (pnpm@11.12.0) и падает, если задать обе. Единственный
        # источник истины. Под pnpm 9 overrides читались из package.json, а не
        # из pnpm-workspace.yaml — 35 оверрайдов не применялись (issue #10).
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # 22, не 20: pnpm 11 требует Node >=22.13 (issue #10).
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Vitest smoke
        run: pnpm --filter web-seller test
