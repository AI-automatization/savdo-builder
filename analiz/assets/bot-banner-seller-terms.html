<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body {
    margin: 0; padding: 0;
    width: 1200px; height: 630px;
    background: radial-gradient(120% 140% at 15% 10%, #1a1a1a 0%, #0a0a0a 55%, #050505 100%);
    font-family: Inter, "Segoe UI", system-ui, -apple-system, sans-serif;
    overflow: hidden;
  }
  .frame {
    position: relative;
    width: 1200px; height: 630px;
    box-sizing: border-box;
    padding: 64px 72px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .glow {
    position: absolute;
    border-radius: 50%;
    filter: blur(90px);
    opacity: 0.35;
  }
  .glow.g1 { width: 420px; height: 420px; background: #C9A876; top: -160px; right: -120px; }
  .glow.g2 { width: 360px; height: 360px; background: #3A3A3A; bottom: -180px; left: -100px; opacity: 0.5; }

  .top-row { display: flex; align-items: center; gap: 18px; z-index: 2; }
  .mark { width: 56px; height: 56px; flex-shrink: 0; }
  .wordmark { color: #F5F5F5; font-size: 26px; font-weight: 700; letter-spacing: 0.5px; }
  .wordmark span { color: #C9A876; }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    align-self: flex-start;
    background: rgba(201, 168, 118, 0.12);
    border: 1px solid rgba(201, 168, 118, 0.4);
    color: #C9A876;
    font-size: 15px;
    font-weight: 600;
    padding: 8px 18px;
    border-radius: 999px;
    z-index: 2;
    margin-top: 24px;
  }

  .headline {
    color: #FFFFFF;
    font-size: 54px;
    font-weight: 800;
    line-height: 1.15;
    margin-top: 22px;
    z-index: 2;
    max-width: 920px;
  }
  .headline .accent { color: #C9A876; }

  .subline {
    color: #B8B8B8;
    font-size: 22px;
    font-weight: 400;
    line-height: 1.5;
    margin-top: 18px;
    max-width: 760px;
    z-index: 2;
  }

  .bottom-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    z-index: 2;
  }
  .cta {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    background: linear-gradient(135deg, #C9A876, #E4C89A);
    color: #0A0A0A;
    font-size: 20px;
    font-weight: 700;
    padding: 16px 32px;
    border-radius: 14px;
  }
  .steps {
    color: #6E6E6E;
    font-size: 18px;
    font-weight: 600;
    letter-spacing: 1px;
  }
  .steps b { color: #C9A876; }
</style>
</head>
<body>
  <div class="frame">
    <div class="glow g1"></div>
    <div class="glow g2"></div>

    <div>
      <div class="top-row">
        <svg class="mark" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
          <clipPath id="cl"><rect x="0" y="0" width="50" height="100"/></clipPath>
          <clipPath id="cr"><rect x="50" y="0" width="50" height="100"/></clipPath>
          <path d="M 35 22 Q 50 4 65 22" stroke="#C9A876" stroke-width="6" fill="none" stroke-linecap="round"/>
          <text x="50" y="92" text-anchor="middle" font-family="Inter, sans-serif" font-weight="900" font-size="100" fill="#F5F5F5" clip-path="url(#cl)">M</text>
          <text x="50" y="92" text-anchor="middle" font-family="Inter, sans-serif" font-weight="900" font-size="100" fill="#C9A876" clip-path="url(#cr)">M</text>
        </svg>
        <div class="wordmark">max<span>savdo</span></div>
      </div>

      <div class="badge">🏪 Регистрация продавца</div>

      <div class="headline">Остался один шаг<br>до <span class="accent">своего магазина</span></div>
      <div class="subline">Ознакомьтесь с условиями использования платформы и подтвердите согласие — дальше запускаем витрину и приём заказов.</div>
    </div>

    <div class="bottom-row">
      <div class="cta">✅ Принимаю условия</div>
      <div class="steps">ШАГ <b>4</b> / 4</div>
    </div>
  </div>
</body>
</html>
